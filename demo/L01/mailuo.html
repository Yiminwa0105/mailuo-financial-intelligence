<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脉络 Financial Intelligence · 可追溯的金融研究时间线</title>
<style>
  :root {
    --navy-900: #0b1f3a;
    --navy-800: #12294d;
    --navy-700: #1c3a66;
    --navy-600: #2a4d85;
    --graphite-900: #1f2733;
    --graphite-700: #3a4556;
    --graphite-500: #64707f;
    --graphite-300: #b9c1cc;
    --graphite-200: #dde2e8;
    --graphite-100: #eef1f5;
    --bg: #f4f6f9;
    --white: #ffffff;
    --green: #2f7d5b;
    --green-bg: #e6f2ec;
    --red: #a8433f;
    --red-bg: #f6e9e8;
    --amber: #9a6b1f;
    --amber-bg: #f7efdd;
    --blue: #2a4d85;
    --blue-bg: #e8eef7;
    --purple: #5a4d8a;
    --purple-bg: #eeeaf7;
    --teal: #2c6e74;
    --teal-bg: #e4f0f1;
    --shadow-sm: 0 1px 3px rgba(11, 31, 58, 0.08);
    --shadow-md: 0 8px 24px rgba(11, 31, 58, 0.10);
    --shadow-lg: 0 20px 56px rgba(11, 31, 58, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--graphite-900);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ============ 顶栏 ============ */
  .topbar {
    background: linear-gradient(120deg, var(--navy-900) 0%, var(--navy-800) 60%, var(--navy-700) 100%);
    color: #fff;
    padding: 0 32px;
    height: 68px;
    display: flex;
    align-items: center;
    gap: 28px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow-md);
  }

  .brand { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }

  .brand .logo {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, #3d6ab0, #1c3a66);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    align-self: center;
  }

  .brand h1 { font-size: 19px; font-weight: 700; letter-spacing: 1px; }
  .brand .sub { font-size: 11px; letter-spacing: 2.5px; color: rgba(255,255,255,0.55); text-transform: uppercase; }

  .search-box {
    flex: 1;
    max-width: 480px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.10);
    color: #fff;
    font-size: 13px;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .search-box input::placeholder { color: rgba(255,255,255,0.45); }

  .search-box input:focus {
    outline: none;
    background: rgba(255,255,255,0.16);
    border-color: rgba(255,255,255,0.5);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
  }

  .search-box .icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,0.5); font-size: 14px; pointer-events: none;
  }

  .quick-topics { display: flex; gap: 8px; margin-left: auto; }

  .quick-chip {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.25);
    background: transparent;
    color: rgba(255,255,255,0.8);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .quick-chip:hover { background: rgba(255,255,255,0.12); color: #fff; }

  .quick-chip.active {
    background: #fff;
    color: var(--navy-800);
    border-color: #fff;
    font-weight: 600;
  }

  /* ============ 主布局 ============ */
  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 32px 64px;
    align-items: start;
  }

  /* ============ 左侧栏 ============ */
  .sidebar { position: sticky; top: 92px; display: flex; flex-direction: column; gap: 20px; }

  .panel {
    background: var(--white);
    border: 1px solid var(--graphite-200);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
  }

  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--graphite-100);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--graphite-500);
    text-transform: uppercase;
  }

  .panel-body { padding: 18px; }

  /* 主题概览 */
  .topic-name { font-size: 20px; font-weight: 700; color: var(--navy-900); margin-bottom: 10px; }

  .topic-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

  .topic-tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--blue-bg);
    color: var(--blue);
    font-weight: 600;
  }

  .topic-desc { font-size: 13px; color: var(--graphite-700); margin-bottom: 16px; }

  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .metric-card {
    background: var(--graphite-100);
    border-radius: 8px;
    padding: 10px 12px;
    border-left: 3px solid var(--navy-600);
  }

  .metric-card .m-label { font-size: 11px; color: var(--graphite-500); margin-bottom: 2px; }
  .metric-card .m-value { font-size: 16px; font-weight: 700; color: var(--graphite-900); font-variant-numeric: tabular-nums; }
  .metric-card .m-delta { font-size: 11px; font-weight: 600; margin-top: 2px; }
  .metric-card .m-delta.up { color: var(--green); }
  .metric-card .m-delta.down { color: var(--red); }

  /* 筛选 */
  .filter-group { margin-bottom: 18px; }
  .filter-group:last-child { margin-bottom: 0; }

  .filter-title {
    font-size: 12px; font-weight: 700; color: var(--graphite-700);
    margin-bottom: 8px; letter-spacing: 0.5px;
  }

  .type-filters { display: flex; flex-wrap: wrap; gap: 6px; }

  .type-chip {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--graphite-200);
    background: var(--white);
    color: var(--graphite-700);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .type-chip:hover { border-color: var(--navy-600); color: var(--navy-600); }

  .type-chip.on {
    background: var(--navy-800);
    border-color: var(--navy-800);
    color: #fff;
    font-weight: 600;
  }

  .range-filters { display: flex; gap: 6px; }

  .range-btn {
    flex: 1;
    padding: 7px 0;
    border-radius: 6px;
    border: 1px solid var(--graphite-200);
    background: var(--white);
    color: var(--graphite-700);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
    text-align: center;
  }

  .range-btn:hover { border-color: var(--navy-600); color: var(--navy-600); }

  .range-btn.on {
    background: var(--navy-800);
    border-color: var(--navy-800);
    color: #fff;
    font-weight: 600;
  }

  /* 我的标记 */
  .mark-stats { display: flex; gap: 10px; }

  .mark-stat {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    border-radius: 8px;
    background: var(--graphite-100);
  }

  .mark-stat .num { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .mark-stat .lbl { font-size: 11px; color: var(--graphite-500); margin-top: 2px; }
  .mark-stat.fav .num { color: var(--amber); }
  .mark-stat.imp .num { color: var(--red); }

  /* ============ 时间线 ============ */
  .timeline-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }

  .timeline-head h2 { font-size: 17px; font-weight: 700; color: var(--navy-900); }

  .timeline-head .count { font-size: 12px; color: var(--graphite-500); }

  .timeline { position: relative; padding-left: 36px; }

  .timeline::before {
    content: "";
    position: absolute;
    left: 11px; top: 8px; bottom: 8px;
    width: 2px;
    background: linear-gradient(to bottom, var(--navy-600), var(--graphite-300));
    border-radius: 2px;
  }

  .tl-item { position: relative; margin-bottom: 18px; animation: tlIn 0.35s ease both; }

  @keyframes tlIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tl-node {
    position: absolute;
    left: -36px; top: 20px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--white);
    border: 2px solid var(--node-color, var(--navy-600));
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    z-index: 1;
  }

  .tl-card {
    background: var(--white);
    border: 1px solid var(--graphite-200);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  }

  .tl-card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--graphite-300);
    transform: translateY(-1px);
  }

  .tl-card.important { border-left: 3px solid var(--red); }
  .tl-card.important.flash { animation: impFlash 0.6s ease; }

  @keyframes impFlash {
    0% { box-shadow: 0 0 0 0 rgba(168, 67, 63, 0.35); }
    100% { box-shadow: 0 0 0 14px rgba(168, 67, 63, 0); }
  }

  .tl-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }

  .tl-time {
    font-size: 12px;
    color: var(--graphite-500);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.3px;
  }

  .type-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }

  .type-earnings { background: var(--blue-bg); color: var(--blue); }
  .type-announce { background: var(--teal-bg); color: var(--teal); }
  .type-macro { background: var(--purple-bg); color: var(--purple); }
  .type-news { background: var(--graphite-100); color: var(--graphite-700); }
  .type-report { background: var(--green-bg); color: var(--green); }
  .type-opinion { background: var(--amber-bg); color: var(--amber); }

  .impact-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 999px;
  }

  .impact-pos { background: var(--green-bg); color: var(--green); }
  .impact-neg { background: var(--red-bg); color: var(--red); }
  .impact-neu { background: var(--graphite-100); color: var(--graphite-500); }

  .imp-flag {
    display: none;
    font-size: 11px; font-weight: 700;
    color: var(--red);
    align-items: center; gap: 3px;
  }

  .tl-card.important .imp-flag { display: inline-flex; }

  .tl-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--graphite-900);
    margin-bottom: 6px;
    cursor: pointer;
    transition: color 0.15s ease;
  }

  .tl-title:hover { color: var(--navy-600); }

  .tl-summary {
    font-size: 13px;
    color: var(--graphite-700);
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .tl-summary .hl { font-weight: 700; color: var(--navy-800); }
  .tl-summary .hl-pos { font-weight: 700; color: var(--green); }
  .tl-summary .hl-neg { font-weight: 700; color: var(--red); }

  .tl-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 10px;
    border-top: 1px dashed var(--graphite-200);
  }

  .tl-source {
    font-size: 12px; color: var(--graphite-500);
    display: flex; align-items: center; gap: 5px;
  }

  .tl-source a {
    color: var(--navy-600); text-decoration: none; font-weight: 600;
  }

  .tl-source a:hover { text-decoration: underline; }

  .tl-actions { display: flex; gap: 6px; }

  .act-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 11px;
    border-radius: 6px;
    border: 1px solid var(--graphite-200);
    background: var(--white);
    color: var(--graphite-500);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .act-btn:hover { border-color: var(--navy-600); color: var(--navy-600); }

  .act-btn.faved {
    background: var(--amber-bg); border-color: var(--amber); color: var(--amber);
    font-weight: 600;
  }

  .act-btn.imped {
    background: var(--red-bg); border-color: var(--red); color: var(--red);
    font-weight: 600;
  }

  .act-btn.pop { animation: pop 0.3s ease; }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  .empty-state {
    text-align: center;
    padding: 64px 20px;
    background: var(--white);
    border: 1px dashed var(--graphite-300);
    border-radius: 12px;
    color: var(--graphite-500);
  }

  .empty-state .big { font-size: 32px; margin-bottom: 10px; }

  /* ============ 详情抽屉 ============ */
  .drawer-mask {
    position: fixed; inset: 0;
    background: rgba(11, 31, 58, 0.45);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 90;
  }

  .drawer-mask.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 460px;
    max-width: 92vw;
    background: var(--white);
    box-shadow: var(--shadow-lg);
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 100;
    display: flex;
    flex-direction: column;
  }

  .drawer.open { transform: translateX(0); }

  .drawer-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--graphite-100);
    background: linear-gradient(120deg, var(--navy-900), var(--navy-700));
    color: #fff;
  }

  .drawer-header .d-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .drawer-header .d-time { font-size: 12px; color: rgba(255,255,255,0.65); }
  .drawer-header h3 { font-size: 17px; font-weight: 700; line-height: 1.5; }

  .drawer-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .drawer-close:hover { background: rgba(255,255,255,0.25); }

  .drawer-body { flex: 1; overflow-y: auto; padding: 22px 24px; }

  .drawer-section { margin-bottom: 22px; }

  .drawer-section .d-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--graphite-500); text-transform: uppercase;
    margin-bottom: 8px;
  }

  .drawer-section .d-text { font-size: 14px; color: var(--graphite-900); line-height: 1.8; }

  .d-source-box {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--graphite-100);
    border-radius: 8px;
    padding: 12px 14px;
  }

  .d-source-box .s-name { font-size: 13px; font-weight: 600; color: var(--graphite-900); }
  .d-source-box .s-type { font-size: 11px; color: var(--graphite-500); margin-top: 1px; }

  .d-source-link {
    font-size: 12px; font-weight: 600;
    color: var(--navy-600); text-decoration: none;
    padding: 6px 12px;
    border: 1px solid var(--navy-600);
    border-radius: 6px;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .d-source-link:hover { background: var(--navy-600); color: #fff; }

  .d-tags { display: flex; flex-wrap: wrap; gap: 6px; }

  .d-tag {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--blue-bg);
    color: var(--blue);
    font-weight: 600;
  }

  .drawer-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--graphite-100);
    display: flex; gap: 10px;
  }

  .drawer-footer .act-btn { flex: 1; justify-content: center; padding: 10px 0; font-size: 13px; }

  /* ============ Toast ============ */
  .toast-wrap {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex; flex-direction: column; gap: 8px;
    align-items: center;
    pointer-events: none;
  }

  .toast {
    background: var(--graphite-900);
    color: #fff;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 8px;
    box-shadow: var(--shadow-lg);
    animation: toastIn 0.25s ease, toastOut 0.3s ease 1.8s forwards;
    display: flex; align-items: center; gap: 8px;
  }

  .toast .t-icon { font-weight: 700; }
  .toast.fav .t-icon { color: #e8b34b; }
  .toast.imp .t-icon { color: #e07b76; }
  .toast.info .t-icon { color: #7fa8d9; }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes toastOut {
    to { opacity: 0; transform: translateY(8px); }
  }

  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .quick-topics { display: none; }
  }
</style>
</head>
<body>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">脉</div>
      <div>
        <h1>脉络</h1>
        <div class="sub">Financial Intelligence</div>
      </div>
    </div>
    <div class="search-box">
      <span class="icon">⌕</span>
      <input type="text" id="searchInput" placeholder="搜索公司、行业或宏观主题，如：宁德时代 / 人工智能 / 美国降息" />
    </div>
    <nav class="quick-topics" id="quickTopics"></nav>
  </header>

  <div class="layout">
    <!-- 左侧栏 -->
    <aside class="sidebar">
      <!-- 主题概览 -->
      <section class="panel">
        <div class="panel-header">研究主题概览</div>
        <div class="panel-body">
          <div class="topic-name" id="topicName">—</div>
          <div class="topic-tags" id="topicTags"></div>
          <p class="topic-desc" id="topicDesc"></p>
          <div class="metric-grid" id="metricGrid"></div>
        </div>
      </section>

      <!-- 筛选 -->
      <section class="panel">
        <div class="panel-header">Timeline 筛选</div>
        <div class="panel-body">
          <div class="filter-group">
            <div class="filter-title">信息类型</div>
            <div class="type-filters" id="typeFilters"></div>
          </div>
          <div class="filter-group">
            <div class="filter-title">时间范围</div>
            <div class="range-filters" id="rangeFilters"></div>
          </div>
        </div>
      </section>

      <!-- 我的标记 -->
      <section class="panel">
        <div class="panel-header">我的研究留痕</div>
        <div class="panel-body">
          <div class="mark-stats">
            <div class="mark-stat fav">
              <div class="num" id="favCount">0</div>
              <div class="lbl">已收藏</div>
            </div>
            <div class="mark-stat imp">
              <div class="num" id="impCount">0</div>
              <div class="lbl">标为重要</div>
            </div>
          </div>
        </div>
      </section>
    </aside>

    <!-- 右侧时间线 -->
    <main>
      <div class="timeline-head">
        <h2>事件时间线</h2>
        <span class="count" id="tlCount"></span>
      </div>
      <div class="timeline" id="timeline"></div>
    </main>
  </div>

  <!-- 详情抽屉 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <button class="drawer-close" id="drawerClose">✕</button>
      <div class="d-meta">
        <span class="type-badge" id="dType"></span>
        <span class="impact-badge" id="dImpact"></span>
        <span class="d-time" id="dTime"></span>
      </div>
      <h3 id="dTitle"></h3>
    </div>
    <div class="drawer-body">
      <div class="drawer-section">
        <div class="d-label">事件摘要</div>
        <div class="d-text" id="dSummary"></div>
      </div>
      <div class="drawer-section">
        <div class="d-label">信息来源</div>
        <div class="d-source-box">
          <div>
            <div class="s-name" id="dSourceName"></div>
            <div class="s-type" id="dSourceType"></div>
          </div>
          <a class="d-source-link" id="dSourceLink" href="#" target="_blank" rel="noopener">查看原文 ↗</a>

  /* ================= 状态 ================= */

  var state = {
    topic: "宁德时代",
    types: {},        // type -> bool
    range: "all",
    favs: {},
    imps: {},
    currentDetail: null
  };

  Object.keys(TYPE_META).forEach(function (t) { state.types[t] = true; });

  /* ================= 工具 ================= */

  var NOW = new Date("2026-08-02T12:00:00");

  function parseTime(str) {
    return new Date(str.replace(" ", "T") + ":00");
  }

  function $(id) { return document.getElementById(id); }

  function showToast(msg, kind) {
    var wrap = $("toastWrap");
    var el = document.createElement("div");
    el.className = "toast " + (kind || "info");
    var icon = kind === "fav" ? "★" : kind === "imp" ? "⚑" : "✓";
    el.innerHTML = "<span class='t-icon'>" + icon + "</span><span>" + msg + "</span>";
    wrap.appendChild(el);
    setTimeout(function () { wrap.removeChild(el); }, 2200);
  }

  function popBtn(btn) {
    btn.classList.remove("pop");
    void btn.offsetWidth;
    btn.classList.add("pop");
  }

  /* ================= 主题渲染 ================= */

  function renderTopic() {
    var meta = TOPICS[state.topic];
    $("topicName").textContent = state.topic;
    if (!meta) {
      $("topicTags").innerHTML = "<span class='topic-tag'>自定义主题</span>";
      $("topicDesc").textContent = "该主题暂无专属概览数据，下方展示全库事件时间线。";
      $("metricGrid").innerHTML = "";
      return;
    }
    $("topicTags").innerHTML = meta.tags.map(function (t) {
      return "<span class='topic-tag'>" + t + "</span>";
    }).join("");
    $("topicDesc").textContent = meta.desc;
    $("metricGrid").innerHTML = meta.metrics.map(function (m) {
      return "<div class='metric-card'>" +
        "<div class='m-label'>" + m.label + "</div>" +
        "<div class='m-value'>" + m.value + "</div>" +
        "<div class='m-delta " + m.dir + "'>" + (m.dir === "up" ? "▲ " : "▼ ") + m.delta + "</div>" +
        "</div>";
    }).join("");
  }

  function renderQuickTopics() {
    var wrap = $("quickTopics");
    wrap.innerHTML = "";
    Object.keys(TOPICS).forEach(function (name) {
      var btn = document.createElement("button");
      btn.className = "quick-chip" + (name === state.topic ? " active" : "");
      btn.textContent = name;
      btn.addEventListener("click", function () {
        switchTopic(name);
      });
      wrap.appendChild(btn);
    });
  }

  function switchTopic(name) {
    state.topic = name;
    renderTopic();
    renderQuickTopics();
    renderTimeline();
    showToast("已切换到研究主题「" + name + "」", "info");
  }

  /* ================= 筛选渲染 ================= */

  function renderFilters() {
    var tf = $("typeFilters");
    tf.innerHTML = "";
    Object.keys(TYPE_META).forEach(function (key) {
      var btn = document.createElement("button");
      btn.className = "type-chip" + (state.types[key] ? " on" : "");
      btn.textContent = TYPE_META[key].icon + " " + TYPE_META[key].label;
      btn.addEventListener("click", function () {
        state.types[key] = !state.types[key];
        btn.classList.toggle("on", state.types[key]);
        renderTimeline();
      });
      tf.appendChild(btn);
    });

    var rf = $("rangeFilters");
    rf.innerHTML = "";
    RANGES.forEach(function (r) {
      var btn = document.createElement("button");
      btn.className = "range-btn" + (state.range === r.key ? " on" : "");
      btn.textContent = r.label;
      btn.addEventListener("click", function () {
        state.range = r.key;
        Array.prototype.forEach.call(rf.children, function (c) { c.classList.remove("on"); });
        btn.classList.add("on");
        renderTimeline();
      });
      rf.appendChild(btn);
    });
  }

  /* ================= 时间线渲染 ================= */

  function getFilteredEvents() {
    var topicKnown = !!TOPICS[state.topic];
    var rangeDays = null;
    RANGES.forEach(function (r) { if (r.key === state.range) rangeDays = r.days || null; });

    return EVENTS.filter(function (ev) {
      if (topicKnown && ev.topic !== state.topic) return false;
      if (!state.types[ev.type]) return false;
      if (rangeDays) {
        var diff = (NOW - parseTime(ev.time)) / (1000 * 3600 * 24);
        if (diff > rangeDays) return false;
      }
      return true;
    }).sort(function (a, b) { return parseTime(b.time) - parseTime(a.time); });
  }

  function renderTimeline() {
    var list = getFilteredEvents();
    var wrap = $("timeline");
    $("tlCount").textContent = "共 " + list.length + " 条 · " + state.topic;

    if (list.length === 0) {
      wrap.innerHTML = "<div class='empty-state'>" +
        "<div class='big'>◌</div>" +
        "<div>当前筛选条件下暂无事件</div>" +
        "<div style='font-size:12px;margin-top:4px;'>请尝试放宽信息类型或时间范围</div>" +
        "</div>";
      updateMarkStats();
      return;
    }

    wrap.innerHTML = "";
    list.forEach(function (ev, idx) {
      var tm = TYPE_META[ev.type];
      var im = IMPACT_META[ev.impact];
      var item = document.createElement("div");
      item.className = "tl-item";
      item.style.animationDelay = (idx * 0.04) + "s";

      var cardCls = "tl-card" + (state.imps[ev.id] ? " important" : "");
      var favCls = "act-btn act-fav" + (state.favs[ev.id] ? " faved" : "");
      var impCls = "act-btn act-imp" + (state.imps[ev.id] ? " imped" : "");

      item.innerHTML =
        "<div class='tl-node' style='--node-color:" + tm.color + ";color:" + tm.color + "'>" + tm.icon + "</div>" +
        "<div class='" + cardCls + "' data-id='" + ev.id + "'>" +
          "<div class='tl-meta'>" +
            "<span class='tl-time'>" + ev.time + "</span>" +
            "<span class='type-badge " + tm.cls + "'>" + tm.label + "</span>" +
            "<span class='impact-badge " + im.cls + "'>" + im.label + "</span>" +
            "<span class='imp-flag'>⚑ 重要</span>" +
          "</div>" +
          "<div class='tl-title' data-act='detail'>" + ev.title + "</div>" +
          "<div class='tl-summary'>" + ev.brief + "</div>" +
          "<div class='tl-footer'>" +
            "<span class='tl-source'>来源：<a href='" + ev.source.url + "' target='_blank' rel='noopener' data-act='source'>" + ev.source.name + "</a></span>" +
            "<span class='tl-actions'>" +
              "<button class='" + favCls + "' data-act='fav'>" + (state.favs[ev.id] ? "★ 已收藏" : "☆ 收藏") + "</button>" +
              "<button class='" + impCls + "' data-act='imp'>" + (state.imps[ev.id] ? "⚑ 已标重要" : "⚑ 标记重要") + "</button>" +
              "<button class='act-btn' data-act='detail'>详情 →</button>" +
            "</span>" +
          "</div>" +
        "</div>";
      wrap.appendChild(item);
    });

    updateMarkStats();
  }

  /* ================= 交互 ================= */

  function findEvent(id) {
    for (var i = 0; i < EVENTS.length; i++) {
      if (EVENTS[i].id === id) return EVENTS[i];
    }
    return null;
  }

  function updateMarkStats() {
    $("favCount").textContent = Object.keys(state.favs).filter(function (k) { return state.favs[k]; }).length;
    $("impCount").textContent = Object.keys(state.imps).filter(function (k) { return state.imps[k]; }).length;
  }

  function toggleFav(id, btn) {
    state.favs[id] = !state.favs[id];
    if (!state.favs[id]) delete state.favs[id];
    var on = !!state.favs[id];
    if (btn) {
      btn.classList.toggle("faved", on);
      btn.innerHTML = on ? "★ 已收藏" : "☆ 收藏";
      popBtn(btn);
    }
    updateMarkStats();
    showToast(on ? "已加入收藏" : "已取消收藏", "fav");
  }

  function toggleImp(id, btn) {
    state.imps[id] = !state.imps[id];
    if (!state.imps[id]) delete state.imps[id];
    var on = !!state.imps[id];
    if (btn) {
      btn.classList.toggle("imped", on);
      btn.innerHTML = on ? "⚑ 已标重要" : "⚑ 标记重要";
      popBtn(btn);
      var card = btn.closest(".tl-card");
      if (card) {
        card.classList.toggle("important", on);
        if (on) {
          card.classList.remove("flash");
          void card.offsetWidth;
          card.classList.add("flash");
        }
      }
    }
    updateMarkStats();
    showToast(on ? "已标记为重要事件" : "已取消重要标记", "imp");
  }

  /* ================= 详情抽屉 ================= */

  function openDrawer(id) {
    var ev = findEvent(id);
    if (!ev) return;
    state.currentDetail = id;

    var tm = TYPE_META[ev.type];
    var im = IMPACT_META[ev.impact];

    var dType = $("dType");
    dType.textContent = tm.label;
    dType.className = "type-badge " + tm.cls;

    var dImpact = $("dImpact");
    dImpact.textContent = im.label;
    dImpact.className = "impact-badge " + im.cls;

    $("dTime").textContent = ev.time;
    $("dTitle").textContent = ev.title;
    $("dSummary").textContent = ev.summary;
    $("dSourceName").textContent = ev.source.name;
    $("dSourceType").textContent = ev.source.type;
    $("dSourceLink").href = ev.source.url;

    $("dTags").innerHTML = ev.tags.map(function (t) {
      return "<span class='d-tag'># " + t + "</span>";
    }).join("");

    syncDrawerBtns();

    $("drawerMask").classList.add("open");
    $("drawer").classList.add("open");
  }

  function syncDrawerBtns() {
    var id = state.currentDetail;
    if (!id) return;
    var favBtn = $("dFavBtn");
    var impBtn = $("dImpBtn");
    var faved = !!state.favs[id];
    var imped = !!state.imps[id];
    favBtn.classList.toggle("faved", faved);
    favBtn.innerHTML = faved ? "★ 已收藏" : "☆ 收藏";
    impBtn.classList.toggle("imped", imped);
    impBtn.innerHTML = imped ? "⚑ 已标重要" : "⚑ 标记重要";
  }

  function closeDrawer() {
    $("drawerMask").classList.remove("open");
    $("drawer").classList.remove("open");
    state.currentDetail = null;
  }

  /* ================= 事件绑定 ================= */

  $("timeline").addEventListener("click", function (e) {
    var actEl = e.target.closest("[data-act]");
    if (!actEl) return;
    var card = e.target.closest(".tl-card");
    if (!card) return;
    var id = card.getAttribute("data-id");
    var act = actEl.getAttribute("data-act");

    if (act === "source") return; // 链接默认跳转
    e.preventDefault();

    if (act === "fav") toggleFav(id, actEl);
    else if (act === "imp") toggleImp(id, actEl);
    else if (act === "detail") openDrawer(id);
  });

  $("drawerClose").addEventListener("click", closeDrawer);
  $("drawerMask").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDrawer();
  });

  $("dFavBtn").addEventListener("click", function () {
    if (!state.currentDetail) return;
    toggleFav(state.currentDetail, this);
    syncDrawerBtns();
    renderTimeline();
  });

  $("dImpBtn").addEventListener("click", function () {
    if (!state.currentDetail) return;
    toggleImp(state.currentDetail, this);
    syncDrawerBtns();
    renderTimeline();
  });

  // 搜索
  $("searchInput").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var q = this.value.trim();
    if (!q) return;
    switchTopic(q);
    this.value = "";
    this.blur();
  });

  /* ================= 初始化 ================= */

  renderTopic();
  renderQuickTopics();
  renderFilters();
  renderTimeline();

})();
</script>
</body>
</html>
