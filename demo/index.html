<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脉络 Financial Intelligence · 跨市场证券数据与事件研究平台</title>
<style>
  :root {
    --navy-900: #0b1f3a;
    --navy-800: #12294d;
    --navy-700: #1c3a66;
    --navy-600: #2a4d85;
    --graphite-900: #1f2733;
    --graphite-700: #3a4556;
    --graphite-500: #64707f;
    --graphite-300: #b9c1cc;
    --graphite-200: #dde2e8;
    --graphite-100: #eef1f5;
    --bg: #f4f6f9;
    --white: #ffffff;
    --green: #2f7d5b;
    --green-bg: #e6f2ec;
    --red: #a8433f;
    --red-bg: #f6e9e8;
    --amber: #9a6b1f;
    --amber-bg: #f7efdd;
    --blue-bg: #e8eef7;
    --purple: #5a4d8a;
    --purple-bg: #eeeaf7;
    --teal: #2c6e74;
    --teal-bg: #e4f0f1;
    --shadow-sm: 0 1px 3px rgba(11, 31, 58, 0.08);
    --shadow-md: 0 8px 24px rgba(11, 31, 58, 0.10);
    --shadow-lg: 0 20px 56px rgba(11, 31, 58, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--graphite-900);
    font-size: 14px;
    line-height: 1.6;
  }

  .num { font-variant-numeric: tabular-nums; }

  /* ============ 顶栏 ============ */
  .topbar {
    background: linear-gradient(120deg, var(--navy-900) 0%, var(--navy-800) 60%, var(--navy-700) 100%);
    color: #fff;
    padding: 14px 32px 0;
    position: sticky;
    top: 0;
    z-index: 60;
    box-shadow: var(--shadow-md);
  }

  .topbar-row { display: flex; align-items: center; gap: 24px; }

  .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; cursor: pointer; }

  .brand .logo {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, #3d6ab0, #1c3a66);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
  }

  .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  .brand .sub { font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.5); text-transform: uppercase; }

  /* 搜索区 */
  .search-wrap { flex: 1; max-width: 640px; position: relative; }

  .search-box { position: relative; }

  .search-box input {
    width: 100%;
    padding: 11px 16px 11px 42px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .search-box input::placeholder { color: rgba(255,255,255,0.45); }

  .search-box input:focus {
    outline: none;
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.55);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
  }

  .search-box .icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,0.55); font-size: 15px; pointer-events: none;
  }

  .search-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--white);
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--graphite-200);
    overflow: hidden;
    display: none;
    z-index: 80;
    max-height: 380px;
    overflow-y: auto;
  }

  .search-dropdown.open { display: block; }

  .sd-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--graphite-100);
    transition: background 0.12s ease;
  }

  .sd-item:last-child { border-bottom: none; }
  .sd-item:hover, .sd-item.hover { background: var(--blue-bg); }

  .sd-item .sd-code { font-size: 12px; color: var(--graphite-500); font-variant-numeric: tabular-nums; min-width: 82px; }
  .sd-item .sd-name { font-weight: 600; color: var(--graphite-900); }
  .sd-item .sd-name .en { font-weight: 400; color: var(--graphite-500); font-size: 12px; margin-left: 6px; }
  .sd-item .sd-ind { margin-left: auto; font-size: 11px; color: var(--graphite-500); }

  .sd-empty { padding: 18px; text-align: center; color: var(--graphite-500); font-size: 13px; }

  /* 市场筛选 chips */
  .market-chips { display: flex; gap: 6px; padding: 8px 0 10px; }

  .mkt-chip {
    padding: 3px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.25);
    background: transparent;
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .mkt-chip:hover { background: rgba(255,255,255,0.12); color: #fff; }

  .mkt-chip.on { background: #fff; color: var(--navy-800); border-color: #fff; font-weight: 700; }

  .sim-badge {
    margin-left: auto;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(232, 179, 75, 0.18);
    border: 1px solid rgba(232, 179, 75, 0.5);
    color: #f0cd85;
    white-space: nowrap;
  }

  /* 市场标签 */
  .market-tag {
    display: inline-flex; align-items: center;
    font-size: 11px; font-weight: 700;
    padding: 2px 9px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .mkt-CN { background: #f6e9e8; color: #a8433f; }
  .mkt-US { background: #e8eef7; color: #2a4d85; }
  .mkt-HK { background: #eeeaf7; color: #5a4d8a; }
  .mkt-KR { background: #e4f0f1; color: #2c6e74; }

  /* ============ 主体 ============ */
  .page { max-width: 1240px; margin: 0 auto; padding: 22px 32px 64px; }

  /* 欢迎页 */
  .welcome { padding: 48px 0 20px; }

  .welcome h2 { font-size: 24px; color: var(--navy-900); font-weight: 700; margin-bottom: 8px; }
  .welcome p { color: var(--graphite-500); font-size: 14px; margin-bottom: 26px; max-width: 640px; }

  .hot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }

  .hot-card {
    background: var(--white);
    border: 1px solid var(--graphite-200);
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: var(--shadow-sm);
  }

  .hot-card:hover { border-color: var(--navy-600); box-shadow: var(--shadow-md); transform: translateY(-2px); }

  .hot-card .h-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .hot-card .h-name { font-weight: 700; color: var(--graphite-900); font-size: 15px; }
  .hot-card .h-code { font-size: 12px; color: var(--graphite-500); margin-bottom: 4px; }
  .hot-card .h-ind { font-size: 12px; color: var(--graphite-500); }

  /* 公司头部 */
  .co-header {
    background: var(--white);
    border: 1px solid var(--graphite-200);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    padding: 20px 24px;
    margin-bottom: 18px;
  }

  .co-row1 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }

  .co-name { font-size: 22px; font-weight: 800; color: var(--navy-900); }
  .co-code { font-size: 13px; color: var(--graphite-500); font-variant-numeric: tabular-nums; }
  .co-ind { font-size: 12px; color: var(--graphite-500); }
  .co-en { font-size: 12px; color: var(--graphite-300); }

  .co-row2 {
    display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap;
    margin-top: 12px; padding-top: 14px;
    border-top: 1px solid var(--graphite-100);
  }

  .co-price-main { display: flex; align-items: baseline; gap: 12px; }

  .co-price { font-size: 34px; font-weight: 800; color: var(--graphite-900); line-height: 1.1; }
  .co-price.up { color: var(--green); }
  .co-price.down { color: var(--red); }

  .co-chg { font-size: 15px; font-weight: 700; }
  .co-chg.up { color: var(--green); }
  .co-chg.down { color: var(--red); }

  .co-stat { min-width: 96px; }
  .co-stat .s-lbl { font-size: 11px; color: var(--graphite-500); margin-bottom: 2px; }
  .co-stat .s-val { font-size: 15px; font-weight: 700; color: var(--graphite-900); }

  .co-update { margin-left: auto; font-size: 11px; color: var(--graphite-500); text-align: right; line-height: 1.5; }

  /* 标签页 */
  .tabs {
    display: flex; gap: 2px;
    background: var(--white);
    border: 1px solid var(--graphite-200);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
    overflow-x: auto;
  }

  .tab-btn {
    flex: 1;
    padding: 9px 14px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--graphite-500);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .tab-btn:hover { color: var(--navy-800); background: var(--graphite-100); }

  .tab-btn.on { background: var(--navy-800); color: #fff; }

  .tab-panel { display: none; }
  .tab-panel.on { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* 卡片与表格 */
  .card {
    background: var(--white);
    border: 1px solid var(--graphite-200);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
  }

  .card-head {
    padding: 13px 18px;
    border-bottom: 1px solid var(--graphite-100);
    display: flex; align-items: center; justify-content: space-between;
  }

  .card-head .c-title { font-size: 13px; font-weight: 700; color: var(--navy-900); letter-spacing: 0.5px; }
  .card-head .c-note { font-size: 11px; color: var(--graphite-500); }

  .card-body { padding: 18px; }

  .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }

  .kv {
    background: var(--graphite-100);
    border-radius: 8px;
    padding: 10px 13px;
  }

  .kv .k { font-size: 11px; color: var(--graphite-500); margin-bottom: 2px; }
  .kv .v { font-size: 16px; font-weight: 700; color: var(--graphite-900); }
  .kv .v.up { color: var(--green); }
  .kv .v.down { color: var(--red); }
  .kv .d { font-size: 11px; margin-top: 1px; color: var(--graphite-500); }

  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }

  .data-table th {
    text-align: left;
    font-size: 11px;
    color: var(--graphite-500);
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 8px 12px;
    border-bottom: 2px solid var(--graphite-200);
    white-space: nowrap;
  }

  .data-table td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--graphite-100);
    color: var(--graphite-900);
  }

  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: var(--graphite-100); }
  .data-table td.r, .data-table th.r { text-align: right; }

  .chg-pos { color: var(--green); font-weight: 600; }
  .chg-neg { color: var(--red); font-weight: 600; }
  .chg-neu { color: var(--graphite-500); }

  .chart-box { padding: 10px 14px 4px; }
  .chart-legend { display: flex; gap: 16px; font-size: 11px; color: var(--graphite-500); padding: 4px 18px 12px; }
  .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }

  .src-line {
    padding: 10px 18px;
    border-top: 1px dashed var(--graphite-200);
    font-size: 11px;
    color: var(--graphite-500);
    display: flex; gap: 18px; flex-wrap: wrap;
  }

  /* ============ Timeline ============ */
  .tl-filters {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--graphite-100);
    align-items: center;
  }

  .tl-filters .f-label { font-size: 11px; font-weight: 700; color: var(--graphite-500); margin-right: 2px; }

  .type-chip {
    padding: 4px 11px;
    border-radius: 6px;
    border: 1px solid var(--graphite-200);
    background: var(--white);
    color: var(--graphite-700);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .type-chip:hover { border-color: var(--navy-600); color: var(--navy-600); }
  .type-chip.on { background: var(--navy-800); border-color: var(--navy-800); color: #fff; font-weight: 600; }

  .f-select {
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--graphite-200);
    font-size: 12px;
    color: var(--graphite-700);
    font-family: inherit;
    background: var(--white);
    cursor: pointer;
  }

  .tl-count { margin-left: auto; font-size: 12px; color: var(--graphite-500); }

  .timeline { position: relative; padding: 20px 18px 20px 52px; }

  .timeline::before {
    content: "";
    position: absolute;
    left: 27px; top: 26px; bottom: 26px;
    width: 2px;
    background: linear-gradient(to bottom, var(--navy-600), var(--graphite-300));
    border-radius: 2px;
  }

  .tl-item { position: relative; margin-bottom: 16px; animation: fadeIn 0.3s ease both; }

  .tl-node {
    position: absolute;
    left: -34px; top: 18px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--white);
    border: 2px solid var(--node-color, var(--navy-600));
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    color: var(--node-color, var(--navy-600));
    z-index: 1;
  }

  .tl-card {
    background: var(--white);
    border: 1px solid var(--graphite-200);
    border-radius: 10px;
    padding: 15px 18px;
    transition: box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .tl-card:hover { box-shadow: var(--shadow-md); border-color: var(--graphite-300); }
  .tl-card.important { border-left: 3px solid var(--red); }
  .tl-card.lv-high .tl-title::before { content: "●"; color: var(--red); font-size: 9px; margin-right: 6px; vertical-align: 2px; }

  .tl-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }

  .tl-time { font-size: 12px; color: var(--graphite-500); font-variant-numeric: tabular-nums; }

  .type-badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }

  .t-earnings { background: var(--blue-bg); color: var(--navy-600); }
  .t-announce { background: var(--teal-bg); color: var(--teal); }
  .t-holder { background: var(--amber-bg); color: var(--amber); }
  .t-institution { background: #e9e2f6; color: #4a3d78; }
  .t-price { background: var(--red-bg); color: var(--red); }
  .t-news { background: var(--graphite-100); color: var(--graphite-700); }
  .t-report { background: var(--green-bg); color: var(--green); }
  .t-macro { background: var(--purple-bg); color: var(--purple); }
  .t-industry { background: #e2eef9; color: #2c5f7c; }

  .impact-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .impact-pos { background: var(--green-bg); color: var(--green); }
  .impact-neg { background: var(--red-bg); color: var(--red); }
  .impact-neu { background: var(--graphite-100); color: var(--graphite-500); }

  .imp-flag { display: none; font-size: 11px; font-weight: 700; color: var(--red); }
  .tl-card.important .imp-flag { display: inline; }

  .tl-title { font-size: 14px; font-weight: 700; color: var(--graphite-900); margin-bottom: 5px; cursor: pointer; }
  .tl-title:hover { color: var(--navy-600); }

  .tl-summary {
    font-size: 13px; color: var(--graphite-700); margin-bottom: 9px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .tl-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 9px; border-top: 1px dashed var(--graphite-200);
  }

  .tl-source { font-size: 12px; color: var(--graphite-500); }
  .tl-source a { color: var(--navy-600); text-decoration: none; font-weight: 600; }
  .tl-source a:hover { text-decoration: underline; }

  .tl-actions { display: flex; gap: 6px; }

  .act-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--graphite-200);
    background: var(--white);
    color: var(--graphite-500);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .act-btn:hover { border-color: var(--navy-600); color: var(--navy-600); }
  .act-btn.faved { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); font-weight: 600; }
  .act-btn.imped { background: var(--red-bg); border-color: var(--red); color: var(--red); font-weight: 600; }
  .act-btn.pop { animation: pop 0.3s ease; }

  @keyframes pop { 50% { transform: scale(1.18); } }

  .empty-state { text-align: center; padding: 56px 20px; color: var(--graphite-500); }
  .empty-state .big { font-size: 30px; margin-bottom: 8px; }

  /* ============ 抽屉 ============ */
  .drawer-mask {
    position: fixed; inset: 0;
    background: rgba(11, 31, 58, 0.45);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 90;
  }

  .drawer-mask.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 470px; max-width: 92vw;
    background: var(--white);
    box-shadow: var(--shadow-lg);
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 100;
    display: flex; flex-direction: column;
  }

  .drawer.open { transform: translateX(0); }

  .drawer-header {
    padding: 20px 24px;
    background: linear-gradient(120deg, var(--navy-900), var(--navy-700));
    color: #fff;
    position: relative;
  }

  .drawer-header .d-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .drawer-header .d-time { font-size: 12px; color: rgba(255,255,255,0.65); }
  .drawer-header h3 { font-size: 16px; font-weight: 700; line-height: 1.5; padding-right: 30px; }

  .drawer-close {
    position: absolute; top: 16px; right: 16px;
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: #fff; font-size: 14px; cursor: pointer;
  }

  .drawer-close:hover { background: rgba(255,255,255,0.25); }

  .drawer-body { flex: 1; overflow-y: auto; padding: 22px 24px; }

  .drawer-section { margin-bottom: 20px; }

  .d-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--graphite-500); text-transform: uppercase; margin-bottom: 8px;
  }

  .d-text { font-size: 14px; color: var(--graphite-900); line-height: 1.8; }

  .d-source-box {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--graphite-100); border-radius: 8px; padding: 12px 14px;
  }

  .d-source-box .s-name { font-size: 13px; font-weight: 600; }
  .d-source-box .s-type { font-size: 11px; color: var(--graphite-500); }

  .d-source-link {
    font-size: 12px; font-weight: 600; color: var(--navy-600); text-decoration: none;
    padding: 6px 12px; border: 1px solid var(--navy-600); border-radius: 6px;
    white-space: nowrap; transition: all 0.15s ease;
  }

  .d-source-link:hover { background: var(--navy-600); color: #fff; }

  .d-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .d-tag { font-size: 12px; padding: 4px 12px; border-radius: 999px; background: var(--blue-bg); color: var(--navy-600); font-weight: 600; }

  .d-jump {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px dashed var(--navy-600);
    background: var(--blue-bg);
    color: var(--navy-600);
    font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s ease;
  }

  .d-jump:hover { background: var(--navy-600); color: #fff; }

  .drawer-footer {
    padding: 14px 24px;
    border-top: 1px solid var(--graphite-100);
    display: flex; gap: 10px;
  }

  .drawer-footer .act-btn { flex: 1; justify-content: center; padding: 9px 0; font-size: 13px; }

  /* Toast */
  .toast-wrap {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);

    "通信服务": ["用户 ARPU 环比提升，云/AI/内容新业务贡献增量", "发布新一代自研模型，商业化进程超预期"],
    "房地产": ["核心城市土拍补库，销售降幅连续收窄", "完成债务展期与融资置换，现金流压力缓解"]
  };
  var CN_SUFFIX = { SH_MAIN: ".SH", SH_STAR: ".SH", SZ_MAIN: ".SZ", SZ_GEM: ".SZ", BSE: ".BJ" };

  function exMarket(exId) {
    var keys = Object.keys(COUNTRIES);
    for (var i = 0; i < keys.length; i++) {
      var exs = COUNTRIES[keys[i]].exchanges;
      for (var j = 0; j < exs.length; j++) if (exs[j].id === exId) return keys[i];
    }
    return "CN";
  }

  SEEDS.forEach(function (s, idx) {
    var name = s[0], code = s[1], exId = s[2], sector = s[3];
    var mkt = exMarket(exId);
    var m = MARKETS[mkt];
    if (mkt === "CN" && code.indexOf(".") < 0) code += CN_SUFFIX[exId];

    var id = "s" + idx;
    var seed = hashStr(id + code);
    var rv = function (min, max, k) {
      var x = ((seed * (k * 53 + 7)) % 1000) / 1000;
      return min + (max - min) * x;
    };

    var price = mkt === "KR"
      ? Math.round(rv(6000, 380000, 1)).toLocaleString("en-US")
      : rv(6, mkt === "CN" ? 380 : 880, 1).toFixed(2);
    var pNum = parseFloat(String(price).replace(/,/g, ""));

    var chgV = rv(-3.2, 3.2, 2);
    var dirUp = chgV >= 0;

    var capV = pNum * rv(0.4, 6, 3);
    var cap = capV >= 10000
      ? m.curSym + (capV / 10000).toFixed(2) + " 万亿"
      : m.curSym + Math.round(capV).toLocaleString("en-US") + " 亿";

    var instV = rv(0.1, 1.6, 4);
    var instPos = rv(0, 1, 5) < 0.72;

    var holderRoll = rv(0, 1, 6);
    var holder = "—", holderDir = "neu";
    if (holderRoll < 0.20) { holder = "主要股东 -" + rv(0.1, 0.9, 7).toFixed(1) + "pct"; holderDir = "neg"; }
    else if (holderRoll < 0.28) { holder = "控股股东增持 +" + rv(0.1, 0.6, 8).toFixed(1) + "pct"; holderDir = "pos"; }

    var tpl = TPL[sector];
    var evText = tpl[Math.floor(rv(0, tpl.length - 0.001, 9))];

    var month = rv(0, 1, 10) < 0.7 ? "07" : "06";
    var day = String(1 + Math.floor(rv(0, 27.9, 11)));
    if (day.length < 2) day = "0" + day;

    var digits = code.replace(/[^0-9]/g, "");

    DIRECTORY.push({
      id: id, name: name, nameEn: "", code: code, market: mkt, ex: exId, sector: sector,
      aliases: digits ? [digits] : [code.toLowerCase().replace(".", "")],
      cap: cap, price: String(price),
      chg: (dirUp ? "+" : "") + chgV.toFixed(2) + "%", dir: dirUp ? "up" : "down",
      inst: (instPos ? "+" : "-") + instV.toFixed(1) + "pct", instDir: instPos ? "pos" : "neg",
      holder: holder, holderDir: holderDir,
      event: evText, disc: "2026-" + month + "-" + day
    });
  });
})();

function matchCompany(c, q) {
  q = q.toLowerCase();
  if (c.code.toLowerCase().indexOf(q) >= 0) return true;
  if (c.name.toLowerCase().indexOf(q) >= 0) return true;
  if (c.nameEn.toLowerCase().indexOf(q) >= 0) return true;
  for (var i = 0; i < c.aliases.length; i++) {
    if (c.aliases[i].toLowerCase().indexOf(q) >= 0) return true;
  }
  return false;
}

function renderSearchResults() {
  var dd = $("searchDropdown");
  var q = $("searchInput").value.trim();
  if (!q) { dd.classList.remove("open"); dd.innerHTML = ""; return; }

  var list = DIRECTORY.filter(function (c) {
    if (state.marketFilter !== "ALL" && c.market !== state.marketFilter) return false;
    return matchCompany(c, q);
  });

  if (list.length === 0) {
    dd.innerHTML = "<div class='sd-empty'>未找到匹配的公司，请尝试代码 / 中文名 / 英文名</div>";
  } else {
    dd.innerHTML = "";
    list.forEach(function (c) {
      var item = document.createElement("div");
      item.className = "sd-item";
      item.innerHTML =
        marketTag(c.market) +
        "<span class='sd-code'>" + c.code + "</span>" +
        "<span class='sd-name'>" + c.name + "<span class='en'>" + c.nameEn + "</span></span>" +
        "<span class='sd-ind'>" + c.sector + "</span>";
      item.addEventListener("mousedown", function (e) {
        e.preventDefault();
        selectCompany(c.id);
      });
      dd.appendChild(item);
    });
  }
  dd.classList.add("open");
}

  return exId;

function renderBreadcrumb() {
  var bc = $("breadcrumb");
  if (state.view === "home") { bc.style.display = "none"; return; }
  var parts = ["<span class='bc-link' data-nav='home'>首页</span>"];
  if (state.country) {
    var cn = COUNTRIES[state.country].name;
    if (state.view === "country") parts.push("<span class='bc-cur'>" + cn + "</span>");
    else parts.push("<span class='bc-link' data-nav='country'>" + cn + "</span>");
  }
  if (state.exchange) {
    var en = exchangeName(state.exchange);
    if (state.view === "exchange") parts.push("<span class='bc-cur'>" + en + "</span>");
    else parts.push("<span class='bc-link' data-nav='exchange'>" + en + "</span>");
  }
  if (state.sector) {
    if (state.view === "sector") parts.push("<span class='bc-cur'>" + state.sector + "</span>");
    else parts.push("<span class='bc-link' data-nav='sector'>" + state.sector + "</span>");
  }
  if (state.view === "company" && state.company) {
    var c = findCompany(state.company);
    if (c) parts.push("<span class='bc-cur'>" + c.name + "</span>");
  }
  bc.innerHTML = parts.join("<span class='bc-sep'>/</span>");
}

$("breadcrumb").addEventListener("click", function (e) {
  var l = e.target.closest("[data-nav]");
  if (!l) return;
  var nav = l.getAttribute("data-nav");
  if (nav === "home") goHome();
  else if (nav === "country") goCountry(state.country);
  else if (nav === "exchange") goExchange(state.exchange);
  else if (nav === "sector") goSector(state.sector);
});

/* ================= 通用公司档案生成器（目录公司无手工档案时调用） ================= */

function hashStr(s) {
  var x = 0;
  for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) % 9973;
  return x;
}

function fmtPrice(n) {
  return n >= 1000 ? Math.round(n).toLocaleString("en-US") : n.toFixed(2);
}

function ensureProfile(id) {
  if (findCompany(id)) return;
  var d = findDir(id);
  if (!d) return;
  var m = MARKETS[d.market];
  var seed = hashStr(id);
  var rv = function (min, max, i, dec) {
    var x = ((seed * (i * 37 + 11)) % 1000) / 1000;
    return (min + (max - min) * x).toFixed(dec === undefined ? 1 : dec);
  };
  var p = parseFloat(d.price.replace(/,/g, ""));
  var sym = m.curSym;

  var profile = {
    id: d.id, name: d.name, nameEn: d.nameEn || d.code, code: d.code, market: d.market,
    industry: d.sector, aliases: d.aliases,
    price: d.price, chgPct: d.chg, chgDir: d.dir,
    marketCap: d.cap,
    volume: rv(200, 9000, 1, 0) + " 万股",
    turnover: sym + rv(2, 120, 2, 1) + " 亿",
    high52: fmtPrice(p * 1.22), low52: fmtPrice(p * 0.64),
    valuation: {
      "PE (TTM)": rv(9, 45, 3), "PB": rv(1, 8, 4), "PS (TTM)": rv(1, 9, 5),
      "股息率": rv(0.2, 3.5, 6, 1) + "%", "EV/EBITDA": rv(6, 28, 7), "PEG": rv(0.6, 2.4, 8, 1)
    },
    financials: {
      "营业收入 (TTM)": sym + rv(80, 4000, 9, 0) + " 亿", "净利润 (TTM)": sym + rv(10, 800, 10, 0) + " 亿",
      "毛利率": rv(18, 65, 11) + "%", "净利率": rv(5, 30, 12) + "%",
      "EPS (TTM)": sym + rv(0.5, 20, 13, 2), "ROE": rv(6, 28, 14) + "%", "ROA": rv(3, 18, 15) + "%",
      "经营现金流": sym + rv(20, 900, 16, 0) + " 亿", "资产负债率": rv(20, 70, 17) + "%"
    },
    history: {
      years: ["2022", "2023", "2024", "2025"],
      revenue: [rv(60, 100, 18, 0) * 10, rv(70, 110, 19, 0) * 10, rv(80, 120, 20, 0) * 10, rv(90, 130, 21, 0) * 10],
      profit: [rv(6, 15, 22, 0) * 10, rv(8, 18, 23, 0) * 10, rv(10, 22, 24, 0) * 10, rv(12, 26, 25, 0) * 10]
    },
    peers: DIRECTORY.filter(function (x) { return x.sector === d.sector && x.id !== d.id; }).slice(0, 3).map(function (x) {
      return { name: x.name, code: x.code, market: x.market, pe: rv(9, 40, 26), pb: rv(1, 7, 27), roe: rv(6, 25, 28) + "%", cap: x.cap };
    }),
    shareholders: [
      { name: d.market === "CN" ? "香港中央结算（北向资金）" : "Vanguard Group", pct: rv(4, 12, 29) + "%", change: d.inst, dir: d.instDir },

      { name: d.market === "KR" ? "韩国国民年金公团" : "Geode Capital", pct: rv(1, 4, 32) + "%", change: "0", dir: "neu" },
      { name: "公司管理层合计", pct: rv(0.5, 15, 33) + "%", change: "0", dir: "neu" }
    ],
    inst: { count: rv(200, 2600, 34, 0) + " 家", pct: rv(15, 55, 35) + "%", change: "30 日 " + d.inst, dir: d.instDir },
    mgmtPct: rv(0.5, 20, 36) + "%",
    lockup: d.market === "CN" ? "限售解禁信息：近 12 个月无大规模解禁安排（模拟数据）" : "该市场无锁定期概念；关注大股东及高管持股变动披露（模拟数据）"
  };

/* ================= 盈利与财务 ================= */

function barChart(history, unit) {
  var W = 720, H = 220, padL = 46, padB = 26, padT = 14;
  var n = history.years.length;
  var maxV = Math.max.apply(null, history.revenue.concat(history.profit)) * 1.15;
  var plotW = W - padL - 16, plotH = H - padT - padB;
  var slot = plotW / n, bw = Math.min(34, slot / 3);
  var svg = "<svg viewBox='0 0 " + W + " " + H + "' style='width:100%;height:auto;' xmlns='http://www.w3.org/2000/svg'>";
  // 网格线
  for (var g = 0; g <= 4; g++) {
    var y = padT + plotH * g / 4;
    var val = Math.round(maxV * (1 - g / 4));
    svg += "<line x1='" + padL + "' y1='" + y + "' x2='" + (W - 8) + "' y2='" + y + "' stroke='#eef1f5'/>";
    svg += "<text x='" + (padL - 6) + "' y='" + (y + 4) + "' text-anchor='end' font-size='10' fill='#b9c1cc'>" + val + "</text>";
  }
  history.years.forEach(function (yr, i) {
    var cx = padL + slot * i + slot / 2;
    var rh = plotH * history.revenue[i] / maxV;
    var ph = plotH * history.profit[i] / maxV;
    svg += "<rect x='" + (cx - bw - 3) + "' y='" + (padT + plotH - rh) + "' width='" + bw + "' height='" + rh + "' rx='3' fill='#2a4d85'/>";
    svg += "<rect x='" + (cx + 3) + "' y='" + (padT + plotH - ph) + "' width='" + bw + "' height='" + ph + "' rx='3' fill='#2f7d5b'/>";
    svg += "<text x='" + cx + "' y='" + (H - 8) + "' text-anchor='middle' font-size='11' fill='#64707f'>" + yr + "</text>";
  });
  svg += "</svg>";
  return svg;
}

/* ================= 事件 Timeline ================= */

function getFilteredEvents() {
  var rangeDays = null;
  RANGES.forEach(function (r) { if (r.key === state.range) rangeDays = r.days || null; });

  return (EVENTS[state.company] || []).filter(function (ev) {
    if (!state.types[ev.type]) return false;
    if (state.lvFilter === "high" && ev.lv !== "high") return false;
    if (state.lvFilter === "fav" && !state.favs[ev.id]) return false;
    if (state.lvFilter === "imp" && !state.imps[ev.id]) return false;
    if (rangeDays) {
      var diff = (NOW - parseTime(ev.time)) / 86400000;
      if (diff > rangeDays) return false;
    }
    return true;
  }).sort(function (a, b) { return parseTime(b.time) - parseTime(a.time); });
}

function renderTimelinePanel() {
  var c = findCompany(state.company);
  var chips = "";
  Object.keys(TYPE_META).forEach(function (key) {
    chips += "<button class='type-chip" + (state.types[key] ? " on" : "") + "' data-tltype='" + key + "'>" +
      TYPE_META[key].icon + " " + TYPE_META[key].label + "</button>";
  });
  var rangeOpts = "";
  RANGES.forEach(function (r) {
    rangeOpts += "<option value='" + r.key + "'" + (state.range === r.key ? " selected" : "") + ">" + r.label + "</option>";
  });

  var list = getFilteredEvents();
  var itemsHtml = "";
  if (list.length === 0) {
    itemsHtml = "<div class='empty-state'><div class='big'>◌</div><div>当前筛选条件下暂无事件</div>" +
      "<div style='font-size:12px;margin-top:4px;'>请尝试放宽类型、重要性或时间范围</div></div>";
  } else {
    list.forEach(function (ev, idx) {
      var tm = TYPE_META[ev.type];
      var im = IMPACT_META[ev.imp];
      itemsHtml +=
        "<div class='tl-item' style='animation-delay:" + (idx * 0.04) + "s;'>" +
          "<div class='tl-node' style='--node-color:" + tm.color + "'>" + tm.icon + "</div>" +
          "<div class='tl-card" + (state.imps[ev.id] ? " important" : "") + (ev.lv === "high" ? " lv-high" : "") + "' data-id='" + ev.id + "'>" +
            "<div class='tl-meta'>" +
              "<span class='tl-time'>" + ev.time + "</span>" +
              "<span class='type-badge " + tm.cls + "'>" + tm.label + "</span>" +
              "<span class='impact-badge " + im.cls + "'>" + im.label + "</span>" +
              (ev.lv === "high" ? "<span style='font-size:11px;color:var(--red);font-weight:700;'>高重要性</span>" : "") +
              "<span class='imp-flag'>⚑ 已标重要</span>" +
            "</div>" +
            "<div class='tl-title' data-act='detail'>" + ev.title + "</div>" +
            "<div class='tl-summary'>" + ev.brief + "</div>" +
            "<div class='tl-footer'>" +
              "<span class='tl-source'>来源：<a href='" + ev.src.u + "' target='_blank' rel='noopener'>" + ev.src.n + "</a></span>" +
              "<span class='tl-actions'>" +
                "<button class='act-btn" + (state.favs[ev.id] ? " faved" : "") + "' data-act='fav'>" + (state.favs[ev.id] ? "★ 已收藏" : "☆ 收藏") + "</button>" +
                "<button class='act-btn" + (state.imps[ev.id] ? " imped" : "") + "' data-act='imp'>" + (state.imps[ev.id] ? "⚑ 已标重要" : "⚑ 标记重要") + "</button>" +
                "<button class='act-btn' data-act='detail'>详情 →</button>" +
              "</span>" +
            "</div>" +
          "</div>" +
        "</div>";
    });
  }

  $("panel-timeline").innerHTML =
    "<div class='card'>" +
      "<div class='tl-filters'>" +
        "<span class='f-label'>类型</span>" + chips +
        "<span class='f-label' style='margin-left:8px;'>重要性</span>" +
        "<select class='f-select' id='lvSelect'>" +
          "<option value='all'" + (state.lvFilter === "all" ? " selected" : "") + ">全部</option>" +
          "<option value='high'" + (state.lvFilter === "high" ? " selected" : "") + ">仅高重要性</option>" +
          "<option value='fav'" + (state.lvFilter === "fav" ? " selected" : "") + ">已收藏</option>" +
          "<option value='imp'" + (state.lvFilter === "imp" ? " selected" : "") + ">已标重要</option>" +
        "</select>" +
        "<span class='f-label' style='margin-left:8px;'>范围</span>" +
        "<select class='f-select' id='rangeSelect'>" + rangeOpts + "</select>" +
        "<span class='tl-count'>" + c.name + " · 共 " + list.length + " 条</span>" +
      "</div>" +
      "<div class='timeline'>" + itemsHtml + "</div>" +
      srcLine("事件时间以披露时间为准 · 币种 " + MARKETS[c.market].currency) +
    "</div>";

  // 筛选绑定
  Array.prototype.forEach.call($("panel-timeline").querySelectorAll("[data-tltype]"), function (b) {
    b.addEventListener("click", function () {
      var t = b.getAttribute("data-tltype");
      state.types[t] = !state.types[t];
      renderTimelinePanel();
    });
  });
  $("lvSelect").addEventListener("change", function () {
    state.lvFilter = this.value;
    renderTimelinePanel();
  });
  $("rangeSelect").addEventListener("change", function () {
    state.range = this.value;
    renderTimelinePanel();
  });
}

/* ================= 收藏 / 标记重要 ================= */

function findEvent(id) {
  var list = EVENTS[state.company] || [];
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}

function toggleFav(id, btn) {
  state.favs[id] = !state.favs[id];
  if (!state.favs[id]) delete state.favs[id];
  var on = !!state.favs[id];
  if (btn) {
    btn.classList.toggle("faved", on);
    btn.textContent = on ? "★ 已收藏" : "☆ 收藏";
    popBtn(btn);
  }
  showToast(on ? "已加入收藏" : "已取消收藏", "fav");
}

function toggleImp(id, btn) {
  state.imps[id] = !state.imps[id];
  if (!state.imps[id]) delete state.imps[id];
  var on = !!state.imps[id];
  if (btn) {
    btn.classList.toggle("imped", on);
    btn.textContent = on ? "⚑ 已标重要" : "⚑ 标记重要";
    popBtn(btn);
    var card = btn.closest(".tl-card");
    if (card) card.classList.toggle("important", on);
  }
  showToast(on ? "已标记为重要事件" : "已取消重要标记", "imp");
}

/* ================= 详情抽屉 ================= */

function openDrawer(id) {
  var ev = findEvent(id);
  if (!ev) return;
  state.currentDetail = id;

  var tm = TYPE_META[ev.type];
  var im = IMPACT_META[ev.imp];

  var dType = $("dType");
  dType.textContent = tm.label;
  dType.className = "type-badge " + tm.cls;

  var dImpact = $("dImpact");
  dImpact.textContent = im.label + (ev.lv === "high" ? " · 高重要性" : "");
  dImpact.className = "impact-badge " + im.cls;

  $("dTime").textContent = ev.time;
  $("dTitle").textContent = ev.title;
  $("dSummary").textContent = ev.sum;
  $("dSourceName").textContent = ev.src.n;
  $("dSourceType").textContent = ev.src.t + " · 数据更新 " + UPDATE_TIME;
  $("dSourceLink").href = ev.src.u;

  $("dTags").innerHTML = ev.tags.map(function (t) {
    return "<span class='d-tag'># " + t + "</span>";
  }).join("");

  syncDrawerBtns();
  $("drawerMask").classList.add("open");
  $("drawer").classList.add("open");
}

function syncDrawerBtns() {
  var id = state.currentDetail;
  if (!id) return;
  var faved = !!state.favs[id];
  var imped = !!state.imps[id];
  $("dFavBtn").classList.toggle("faved", faved);
  $("dFavBtn").textContent = faved ? "★ 已收藏" : "☆ 收藏";
  $("dImpBtn").classList.toggle("imped", imped);
  $("dImpBtn").textContent = imped ? "⚑ 已标重要" : "⚑ 标记重要";
}

function closeDrawer() {
  $("drawerMask").classList.remove("open");
  $("drawer").classList.remove("open");
  state.currentDetail = null;
}

function switchTab(tab) {
  state.tab = tab;
  renderTabs();
}

/* ================= 事件绑定 ================= */

// Timeline 面板委托（按钮 / 详情）
$("panel-timeline").addEventListener("click", function (e) {
  var actEl = e.target.closest("[data-act]");
  if (!actEl) return;
  var card = e.target.closest(".tl-card");
  if (!card) return;
  var id = card.getAttribute("data-id");
  var act = actEl.getAttribute("data-act");
  if (act === "fav") toggleFav(id, actEl);
  else if (act === "imp") toggleImp(id, actEl);
  else if (act === "detail") openDrawer(id);
});

// 财报与公告 → 定位到 Timeline 事件
$("panel-filings").addEventListener("click", function (e) {
  var j = e.target.closest("[data-evjump]");
  if (!j) return;
  e.preventDefault();
  switchTab("timeline");
  openDrawer(j.getAttribute("data-evjump"));
});

// 标签页
$("tabsNav").addEventListener("click", function (e) {
  var b = e.target.closest(".tab-btn");
  if (b) switchTab(b.getAttribute("data-tab"));
});

// 抽屉
$("drawerClose").addEventListener("click", closeDrawer);
$("drawerMask").addEventListener("click", closeDrawer);
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closeDrawer();
});

$("dFavBtn").addEventListener("click", function () {
  if (!state.currentDetail) return;
  toggleFav(state.currentDetail, this);
  syncDrawerBtns();
  renderTimelinePanel();
});

$("dImpBtn").addEventListener("click", function () {
  if (!state.currentDetail) return;
  toggleImp(state.currentDetail, this);
  syncDrawerBtns();
  renderTimelinePanel();
});

// 跳转关联数据模块
$("dJump").addEventListener("click", function () {
  var ev = findEvent(state.currentDetail);
  if (!ev) return;
  var tab = TYPE_META[ev.type].tab;
  closeDrawer();
  switchTab(tab);
  showToast("已跳转至「" + document.querySelector("[data-tab='" + tab + "']").textContent + "」模块", "info");
});

// 搜索
$("searchInput").addEventListener("input", renderSearchResults);
$("searchInput").addEventListener("focus", renderSearchResults);
$("searchInput").addEventListener("blur", function () {
  setTimeout(function () { $("searchDropdown").classList.remove("open"); }, 150);
});
$("searchInput").addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return;
  var q = this.value.trim();
  if (!q) return;
  var list = DIRECTORY.filter(function (c) {
    if (state.marketFilter !== "ALL" && c.market !== state.marketFilter) return false;
    return matchCompany(c, q);
  });
  if (list.length > 0) selectCompany(list[0].id);
  else showToast("未找到「" + q + "」对应的公司", "info");
});

// 品牌回首页
$("brandHome").addEventListener("click", goHome);

/* ================= 初始化 ================= */

renderMarketChips();
renderHome();

})();
</script>
