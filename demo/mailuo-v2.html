<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脉络 Financial Intelligence · 跨市场证券数据与事件研究平台</title>
<link rel="stylesheet" href="css/mailuo-v2.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand" id="brandHome">
      <div class="logo">脉</div>
      <div>
        <h1>脉络</h1>
        <div class="sub">Financial Intelligence</div>
      </div>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <span class="icon">⌕</span>
        <input type="text" id="searchInput" placeholder="搜索股票代码 / 中文名 / 英文名，如：腾讯、TSLA、005930、宁德时代" autocomplete="off" />
      </div>
      <div class="search-dropdown" id="searchDropdown"></div>
      <div class="market-chips" id="marketChips"></div>
    </div>
    <div class="sim-badge">◈ 原型演示 · 全部为模拟数据</div>
  </div>
</header>

<div class="page">
  <!-- 浏览架构：国家/地区 → 交易市场 → 板块 → 公司列表 -->
  <div id="browser">
    <nav class="bc" id="breadcrumb" style="display:none;"></nav>

    <div class="welcome" id="viewHome">
      <h2>跨市场证券数据与事件研究</h2>
      <p>按「国家/地区 → 交易市场 → 板块/行业 → 公司数据库」逐层浏览，或使用顶部全局搜索直接定位任一已覆盖公司。当前为原型演示，全部为模拟数据。</p>
      <div class="country-grid" id="countryGrid"></div>
      <h3 class="home-sub">热门公司档案</h3>
      <div class="hot-grid" id="hotGrid"></div>
    </div>

    <div id="viewCountry" style="display:none;"></div>
    <div id="viewExchange" style="display:none;"></div>
    <div id="viewSector" style="display:none;"></div>
  </div>

  <!-- 公司档案页 -->
  <div id="companyPage" style="display:none;">
    <section class="co-header" id="coHeader"></section>

    <nav class="tabs" id="tabsNav">
      <button class="tab-btn" data-tab="timeline">事件 Timeline</button>
      <button class="tab-btn" data-tab="valuation">行情与估值</button>
      <button class="tab-btn" data-tab="financials">盈利与财务</button>
      <button class="tab-btn" data-tab="holders">股东与持仓</button>
      <button class="tab-btn" data-tab="filings">财报与公告</button>
      <button class="tab-btn" data-tab="compare">对比与历史</button>
    </nav>

    <div class="tab-panel" id="panel-timeline"></div>
    <div class="tab-panel" id="panel-valuation"></div>
    <div class="tab-panel" id="panel-financials"></div>
    <div class="tab-panel" id="panel-holders"></div>
    <div class="tab-panel" id="panel-filings"></div>
    <div class="tab-panel" id="panel-compare"></div>
  </div>
</div>

<!-- 详情抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <button class="drawer-close" id="drawerClose">✕</button>
    <div class="d-meta">
      <span class="type-badge" id="dType"></span>
      <span class="impact-badge" id="dImpact"></span>
      <span class="d-time" id="dTime"></span>
    </div>
    <h3 id="dTitle"></h3>
  </div>
  <div class="drawer-body">
    <div class="drawer-section">
      <div class="d-label">事件摘要</div>
      <div class="d-text" id="dSummary"></div>
    </div>
    <div class="drawer-section">
      <div class="d-label">信息来源</div>
      <div class="d-source-box">
        <div>
          <div class="s-name" id="dSourceName"></div>
          <div class="s-type" id="dSourceType"></div>
        </div>
        <a class="d-source-link" id="dSourceLink" href="#" target="_blank" rel="noopener">查看原文 ↗</a>
      </div>
    </div>
    <div class="drawer-section">
      <div class="d-label">关联标签</div>
      <div class="d-tags" id="dTags"></div>
    </div>
    <div class="drawer-section">
      <button class="d-jump" id="dJump">⇥ 跳转至关联数据模块</button>
    </div>
  </div>
  <div class="drawer-footer">
    <button class="act-btn" id="dFavBtn">☆ 收藏</button>
    <button class="act-btn" id="dImpBtn">⚑ 标记重要</button>
  </div>
</aside>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
  import * as D from './js/mailuo-v2.data.js';
  Object.assign(globalThis, D);       // 数据层暴露为全局变量，供 app.js 使用
  await import('./js/mailuo-v2.app.js');
</script>
</body>
</html>
