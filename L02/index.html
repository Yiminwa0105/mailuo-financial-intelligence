<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 新闻快讯</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6b7280;
    --line: #e2e5ea;
    --accent: #2563eb;
    --important: #dc2626;
    --tag-model: #2563eb;
    --tag-product: #059669;
    --tag-company: #d97706;
    --tag-research: #7c3aed;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }

  /* ===== Header ===== */
  header { margin-bottom: 24px; }

  header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .date-line {
    margin-top: 8px;
    font-size: 14px;
    color: var(--muted);
  }

  .daily-summary {
    margin-top: 14px;
    padding: 14px 16px;
    background: linear-gradient(135deg, #eff6ff, #f5f3ff);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    font-size: 15px;
    color: #374151;
  }

  /* ===== Filter buttons ===== */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0 8px;
  }

  .filter-btn {
    padding: 7px 16px;
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }

  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .empty-tip {
    display: none;
    padding: 32px 0;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  /* ===== Timeline ===== */
  .timeline {
    position: relative;
    margin-top: 16px;
    padding-left: 28px;
  }

  .timeline::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 6px;
    bottom: 6px;
    width: 2px;
    background: var(--line);
  }

  .news-item { position: relative; padding-bottom: 28px; }

  /* 普通节点 */
  .news-item::before {
    content: "";
    position: absolute;
    left: -28px;
    top: 8px;
    width: 12px;
    height: 12px;
    margin-left: 2px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #9ca3af;
  }

  /* 重要节点：更大、红色、带光晕 */
  .news-item.important::before {
    top: 5px;
    width: 16px;
    height: 16px;
    margin-left: 0;
    border-color: var(--important);
    background: var(--important);
    box-shadow: 0 0 0 5px rgba(220, 38, 38, 0.15);
  }

  .news-time {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .news-item.important .news-time { color: var(--important); }

  .news-card {
    margin-top: 6px;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .news-item.important .news-card {
    border-color: rgba(220, 38, 38, 0.35);
    box-shadow: 0 2px 10px rgba(220, 38, 38, 0.08);
  }

  .news-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .tag {
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 999px;
    color: #fff;
  }

  .tag-model   { background: var(--tag-model); }
  .tag-product { background: var(--tag-product); }
  .tag-company { background: var(--tag-company); }
  .tag-research{ background: var(--tag-research); }

  .badge-important {
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 999px;
    color: var(--important);
    border: 1px solid var(--important);
    background: #fef2f2;
  }

  .news-title {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 6px;
  }

  .news-summary {
    font-size: 14px;
    color: #4b5563;
    margin-bottom: 12px;
  }

  .news-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source-name { font-size: 13px; color: var(--muted); }

  .source-link {
    display: inline-block;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    text-decoration: none;
    transition: all 0.15s ease;
  }

  .source-link:hover { background: var(--accent); color: #fff; }

  footer {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
  }

  /* ===== 手机适配 ===== */
  @media (max-width: 480px) {
    .container { padding: 24px 14px 48px; }
    header h1 { font-size: 24px; }
    .timeline { padding-left: 24px; }
    .news-item::before { left: -24px; }
    .news-item.important::before { left: -26px; }
    .news-card { padding: 14px; }
    .news-title { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>AI 新闻快讯</h1>
    <p class="date-line" id="todayDate"></p>
    <div class="daily-summary">
      今日摘要：大模型领域迎来多次重要发布，多家公司公布新一代模型与产品更新，AI 监管与基础研究也有新进展。
    </div>
  </header>

  <nav class="filters" id="filters">
    <button class="filter-btn active" data-category="all">全部</button>
    <button class="filter-btn" data-category="model">模型</button>
    <button class="filter-btn" data-category="product">产品</button>
    <button class="filter-btn" data-category="company">公司</button>
    <button class="filter-btn" data-category="research">研究</button>
  </nav>

  <main class="timeline" id="timeline"></main>
  <p class="empty-tip" id="emptyTip">该分类下暂无新闻</p>

  <footer>本页面所有新闻均为演示用假数据</footer>
</div>

<script>
// ===== 假数据 =====
var CATEGORY_NAMES = {
  model: "模型",
  product: "产品",
  company: "公司",
  research: "研究"
};

var NEWS = [
  {
    time: "21:30",
    category: "model",
    important: true,
    title: "OpenAI 发布新一代旗舰模型 GPT-5.2",
    summary: "OpenAI 正式推出 GPT-5.2，宣称在推理与代码能力上大幅提升。新模型即日起向付费用户分批开放。",
    sourceName: "OpenAI 官方博客",
    sourceUrl: "https://openai.com/blog"
  },
  {
    time: "19:45",
    category: "product",
    important: false,
    title: "Notion AI 新增会议纪要自动生成功能",
    summary: "Notion 宣布其 AI 助手可自动整理会议录音并生成结构化纪要。该功能本周内面向所有团队版用户上线。",
    sourceName: "Notion 官方博客",
    sourceUrl: "https://www.notion.com/blog"
  },
  {
    time: "17:20",
    category: "company",
    important: true,
    title: "Anthropic 完成新一轮 200 亿美元融资",
    summary: "Anthropic 宣布完成新一轮融资，估值达到 3500 亿美元。资金将主要用于算力扩张与安全研究。",
    sourceName: "Anthropic 官网",
    sourceUrl: "https://www.anthropic.com/news"
  },
  {
    time: "15:05",
    category: "research",
    important: false,
    title: "DeepMind 论文提出可解释性评估新基准",
    summary: "Google DeepMind 发布新论文，提出一套衡量大模型内部可解释性的基准测试。研究团队已开源全部评估代码。",
    sourceName: "Google DeepMind",
    sourceUrl: "https://deepmind.google/discover/blog/"
  },
  {
    time: "13:40",
    category: "model",
    important: false,
    title: "阿里通义发布 Qwen3-Max 开源权重",
    summary: "阿里通义实验室开源 Qwen3-Max 模型权重，支持 128K 上下文。官方称其在多项中文评测中达到领先水平。",
    sourceName: "通义千问官网",
    sourceUrl: "https://qianwen.aliyun.com/"
  },
  {
    time: "11:15",
    category: "product",
    important: false,
    title: "GitHub Copilot 推出跨仓库代码审查功能",
    summary: "GitHub 宣布 Copilot 现在可以理解跨仓库依赖关系并给出审查建议。企业版用户今日起可开启试用。",
    sourceName: "GitHub 官方博客",
    sourceUrl: "https://github.blog/"
  },
  {
    time: "09:50",
    category: "company",
    important: false,
    title: "英伟达公布新一代 AI 加速卡路线图",
    summary: "英伟达在财报电话会上披露下一代数据中心 GPU 路线图。新产品预计明年下半年量产，能效比提升约 40%。",
    sourceName: "NVIDIA 官方新闻",
    sourceUrl: "https://nvidianews.nvidia.com/"
  },
  {
    time: "08:30",
    category: "research",
    important: false,
    title: "斯坦福发布年度 AI 指数报告",
    summary: "斯坦福大学发布年度 AI Index 报告，指出前沿模型训练成本持续下降。报告同时显示 AI 岗位招聘需求同比增长 32%。",
    sourceName: "斯坦福 HAI",
    sourceUrl: "https://hai.stanford.edu/ai-index"
  },
  {
    time: "07:10",
    category: "model",
    important: false,
    title: "Mistral 推出端侧小模型 Mistral Tiny",
    summary: "法国 AI 公司 Mistral 发布可在手机端运行的 3B 参数小模型。模型采用 Apache 2.0 协议完全开源。",
    sourceName: "Mistral AI 官网",
    sourceUrl: "https://mistral.ai/news"
  }
];

// ===== 渲染 =====
var timelineEl = document.getElementById("timeline");
var emptyTipEl = document.getElementById("emptyTip");

function renderNews(category) {
  timelineEl.innerHTML = "";
  var filtered = NEWS.filter(function (item) {
    return category === "all" || item.category === category;
  });

  emptyTipEl.style.display = filtered.length === 0 ? "block" : "none";

  filtered.forEach(function (item) {
    var el = document.createElement("article");
    el.className = "news-item" + (item.important ? " important" : "");

    el.innerHTML =
      '<div class="news-time">' + item.time + '</div>' +
      '<div class="news-card">' +
        '<div class="news-meta">' +
          '<span class="tag tag-' + item.category + '">' + CATEGORY_NAMES[item.category] + '</span>' +
          (item.important ? '<span class="badge-important">重要</span>' : '') +
        '</div>' +
        '<h2 class="news-title">' + item.title + '</h2>' +
        '<p class="news-summary">' + item.summary + '</p>' +
        '<div class="news-footer">' +
          '<span class="source-name">来源：' + item.sourceName + '</span>' +
          '<a class="source-link" href="' + item.sourceUrl + '" target="_blank" rel="noopener noreferrer">查看来源</a>' +
        '</div>' +
      '</div>';

    timelineEl.appendChild(el);
  });
}

// ===== 筛选交互 =====
document.getElementById("filters").addEventListener("click", function (e) {
  var btn = e.target.closest(".filter-btn");
  if (!btn) return;
  document.querySelectorAll(".filter-btn").forEach(function (b) {
    b.classList.remove("active");
  });
  btn.classList.add("active");
  renderNews(btn.dataset.category);
});

// ===== 当天日期 =====
(function () {
  var now = new Date();
  var weekDays = ["日", "一", "二", "三", "四", "五", "六"];
  document.getElementById("todayDate").textContent =
    now.getFullYear() + " 年 " + (now.getMonth() + 1) + " 月 " + now.getDate() +
    " 日 · 星期" + weekDays[now.getDay()];
})();

renderNews("all");
</script>
</body>
</html>
